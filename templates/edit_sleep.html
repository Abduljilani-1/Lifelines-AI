<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LifeLens AI - Edit Sleep</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    padding: 30px;

    background:

        radial-gradient(
            ellipse at 50% -10%,
            rgba(80,230,255,0.5),
            transparent 40%
        ),

        linear-gradient(
            180deg,
            #021a45 0%,
            #023d6b 30%,
            #00647d 65%,
            #012f48 100%
        );
}


/* CONTAINER */

.container {

    width: 90%;

    max-width: 850px;

    margin: auto;
}


/* HEADER */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 30px;
}

.header h1 {

    font-size: 38px;
}


/* BACK BUTTON */

.back-btn {

    text-decoration: none;

    color: white;

    padding: 12px 22px;

    border-radius: 25px;

    background:
        rgba(0,90,130,0.55);

    border:
        1px solid
        rgba(170,245,255,0.7);
}

.back-btn:hover {

    background:
        rgba(0,130,170,0.65);
}


/* SLEEP BOX */

.sleep-box {

    padding: 30px;

    border-radius: 22px;

    background:
        rgba(0,55,100,0.48);

    border:
        1px solid
        rgba(170,245,255,0.65);

    backdrop-filter: blur(12px);

    box-shadow:
        0 20px 45px
        rgba(0,15,45,0.45);
}


.sleep-box h2 {

    text-align: center;

    margin-bottom: 25px;
}


/* ERROR */

.error {

    background:
        rgba(255,60,60,0.25);

    border:
        1px solid
        rgba(255,130,130,0.8);

    padding: 12px;

    border-radius: 10px;

    margin-bottom: 20px;

    text-align: center;
}


/* FORM GROUP */

.form-group {

    margin-bottom: 22px;
}


.form-group label {

    display: block;

    margin-bottom: 8px;

    font-weight: bold;
}


/* INPUTS */

input,
select,
textarea {

    width: 100%;

    padding: 14px;

    border: none;

    outline: none;

    border-radius: 14px;

    font-size: 16px;

    background:
        rgba(255,255,255,0.96);

    color: #123;
}


input:focus,
select:focus,
textarea:focus {

    box-shadow:
        0 0 0 2px
        rgba(80,230,255,0.8);
}


textarea {

    min-height: 120px;

    resize: vertical;
}


/* DATE + TIME ROW */

.time-row {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 15px;

    margin-bottom: 22px;
}


/* QUALITY */

.sleep-options {

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    gap: 12px;
}


.sleep-option input {

    display: none;
}


.sleep-option label {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    min-height: 100px;

    padding: 10px;

    border-radius: 18px;

    cursor: pointer;

    text-align: center;

    background:
        rgba(0,70,110,0.45);

    border:
        1px solid
        rgba(170,245,255,0.4);

    transition: 0.3s;
}


.sleep-option label:hover {

    transform: translateY(-4px);

    background:
        rgba(0,120,160,0.5);
}


.sleep-option input:checked + label {

    transform: translateY(-4px);

    background:
        rgba(0,160,205,0.55);

    border:
        2px solid
        rgba(190,250,255,0.95);

    box-shadow:
        0 5px 20px
        rgba(50,220,255,0.25);
}


/* EMOJI */

.emoji {

    font-size: 34px;

    margin-bottom: 6px;
}


/* UPDATE BUTTON */

.save-btn {

    display: block;

    width: 100%;

    margin: auto;

    border: none;

    cursor: pointer;

    color: white;

    padding: 14px 30px;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    background:
        rgba(0,155,205,0.85);
}


.save-btn:hover {

    background:
        rgba(0,195,230,0.95);
}


/* MOBILE */

@media (max-width:700px) {

    body {

        padding: 18px 12px;
    }

    .container {

        width: 100%;
    }

    .header {

        flex-direction: column;

        gap: 15px;

        text-align: center;
    }

    .time-row {

        grid-template-columns: 1fr;
    }

    .sleep-options {

        grid-template-columns:
            repeat(2,1fr);
    }

    .sleep-box {

        padding: 22px 15px;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

    <h1>
        😴 Edit Sleep
    </h1>

    <a
        href="{{ url_for('sleep') }}"
        class="back-btn"
    >
        ← Back to Sleep
    </a>

</div>


<!-- SLEEP BOX -->

<div class="sleep-box">

    <h2>
        Update Your Sleep Record
    </h2>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <!-- UPDATED FORM -->

    <form
        method="POST"
        action="{{ url_for('edit_sleep', id=sleep_record.id) }}"
    >


        <!-- DATE + BEDTIME + WAKE TIME -->

        <div class="time-row">


            <div class="form-group">

                <label for="sleep_date">
                    Sleep Date
                </label>

                <input
                    type="date"
                    id="sleep_date"
                    name="sleep_date"
                    value="{{ sleep_record.sleep_date.strftime('%Y-%m-%d') }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="bedtime">
                    Bedtime
                </label>

                <input
                    type="time"
                    id="bedtime"
                    name="bedtime"
                    value="{{ sleep_record.bedtime.strftime('%H:%M') }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="wake_time">
                    Wake-up Time
                </label>

                <input
                    type="time"
                    id="wake_time"
                    name="wake_time"
                    value="{{ sleep_record.wake_time.strftime('%H:%M') }}"
                    required
                >

            </div>


        </div>


        <!-- SLEEP QUALITY -->

        <div class="form-group">

            <label>
                Sleep Quality
            </label>


            <div class="sleep-options">


                <!-- EXCELLENT -->

                <div class="sleep-option">

                    <input
                        type="radio"
                        id="excellent"
                        name="sleep_quality"
                        value="Excellent"

                        {% if sleep_record.sleep_quality == "Excellent" %}
                        checked
                        {% endif %}

                        required
                    >

                    <label for="excellent">

                        <span class="emoji">
                            😍
                        </span>

                        Excellent

                    </label>

                </div>


                <!-- GOOD -->

                <div class="sleep-option">

                    <input
                        type="radio"
                        id="good"
                        name="sleep_quality"
                        value="Good"

                        {% if sleep_record.sleep_quality == "Good" %}
                        checked
                        {% endif %}
                    >

                    <label for="good">

                        <span class="emoji">
                            😊
                        </span>

                        Good

                    </label>

                </div>


                <!-- AVERAGE -->

                <div class="sleep-option">

                    <input
                        type="radio"
                        id="average"
                        name="sleep_quality"
                        value="Average"

                        {% if sleep_record.sleep_quality == "Average" %}
                        checked
                        {% endif %}
                    >

                    <label for="average">

                        <span class="emoji">
                            😐
                        </span>

                        Average

                    </label>

                </div>


                <!-- POOR -->

                <div class="sleep-option">

                    <input
                        type="radio"
                        id="poor"
                        name="sleep_quality"
                        value="Poor"

                        {% if sleep_record.sleep_quality == "Poor" %}
                        checked
                        {% endif %}
                    >

                    <label for="poor">

                        <span class="emoji">
                            😔
                        </span>

                        Poor

                    </label>

                </div>


                <!-- VERY POOR -->

                <div class="sleep-option">

                    <input
                        type="radio"
                        id="verypoor"
                        name="sleep_quality"
                        value="Very Poor"

                        {% if sleep_record.sleep_quality == "Very Poor" %}
                        checked
                        {% endif %}
                    >

                    <label for="verypoor">

                        <span class="emoji">
                            😣
                        </span>

                        Very Poor

                    </label>

                </div>


            </div>

        </div>


        <!-- NOTE -->

        <div class="form-group">

            <label for="note">
                Note
            </label>

            <textarea
                id="note"
                name="note"
                placeholder="How was your sleep?"
            >{{ sleep_record.note or "" }}</textarea>

        </div>


        <!-- UPDATE -->

        <button
            type="submit"
            class="save-btn"
        >
            💾 Update Sleep Record
        </button>


    </form>


</div>


</div>


</body>

</html>
