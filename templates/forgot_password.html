<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - LifeLens AI</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           DASHBOARD OCEAN BACKGROUND
           NO PURPLE
        ===================================================== */

        html,
        body {

            width: 100%;
            min-height: 100%;

            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            /*
            SAME OCEAN FEEL AS LIFELENS DASHBOARD
            */

            background-color: #023d6b !important;

            background-image:
                linear-gradient(
                    180deg,
                    #021a45 0%,
                    #023d6b 30%,
                    #00647d 65%,
                    #012f48 100%
                ) !important;

            background-repeat: no-repeat !important;

            background-attachment: fixed !important;

            background-size: cover !important;

            position: relative;

            overflow: hidden;
        }


        /* =====================================================
           SOFT OCEAN LIGHT
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(75, 230, 255, 0.28),
                    transparent 55%
                );

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================================
           SUBTLE WATER GLOW
        ===================================================== */

        body::after {

            content: "";

            position: fixed;

            left: 0;
            right: 0;

            bottom: 0;

            height: 45%;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(0, 210, 230, 0.16),
                    transparent 65%
                );

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .container {

            position: relative;

            z-index: 5;

            width: 450px;

            padding: 42px 38px;

            background:
                rgba(255, 255, 255, 0.97);

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(0, 15, 40, 0.50);

            border:
                1px solid
                rgba(255, 255, 255, 0.75);
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            font-size: 30px;

            font-weight: bold;

            color: #111827;

            margin-bottom: 20px;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        h2 {

            font-size: 26px;

            color: #111827;

            margin-bottom: 8px;
        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        .subtitle {

            color: #64748b;

            font-size: 16px;

            margin-bottom: 28px;
        }


        /* =====================================================
           DESCRIPTION
        ===================================================== */

        .description {

            color: #334155;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error {

            background:
                #ffe1e1;

            color:
                #dc2626;

            padding: 13px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            border:
                1px solid
                #ffcaca;
        }


        /* =====================================================
           EMAIL INPUT
        ===================================================== */

        input {

            width: 100%;

            padding: 15px;

            border:
                1px solid
                #d1d5db;

            border-radius: 11px;

            font-size: 15px;

            outline: none;

            color: #111827;

            background:
                #ffffff;

            margin-bottom: 18px;

            transition:
                border-color 0.25s,
                box-shadow 0.25s;
        }


        input:focus {

            border-color:
                #087ea4;

            box-shadow:
                0 0 0 3px
                rgba(8, 126, 164, 0.14);
        }


        /* =====================================================
           SEND OTP BUTTON
        ===================================================== */

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #16b9dc,
                    #0874a8
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                all 0.3s ease;

            box-shadow:
                0 7px 18px
                rgba(0, 60, 100, 0.25);
        }


        button:hover {

            transform:
                translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    #25d5ef,
                    #0a8ac0
                );

            box-shadow:
                0 10px 22px
                rgba(0, 60, 100, 0.35);
        }


        button:active {

            transform:
                translateY(0);
        }


        /* =====================================================
           BACK TO LOGIN
        ===================================================== */

        .back {

            display: inline-block;

            margin-top: 25px;

            color:
                #0874a8;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            transition:
                0.2s;
        }


        .back:hover {

            color:
                #064e6e;

            text-decoration:
                underline;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .container {

                width: 92%;

                padding:
                    35px 24px;
            }

            .logo {

                font-size: 27px;
            }

            h2 {

                font-size: 23px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         FORGOT PASSWORD CARD
    ===================================================== -->

    <div class="container">


        <!-- LOGO -->

        <div class="logo">

            🧠 LifeLens AI

        </div>


        <!-- TITLE -->

        <h2>

            Forgot Password?

        </h2>


        <!-- SUBTITLE -->

        <div class="subtitle">

            Reset your password securely

        </div>


        <!-- DESCRIPTION -->

        <p class="description">

            Enter your registered Gmail address.
            We will send a verification OTP to
            your email.

        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="error">

            ⚠️ {{ error }}

        </div>

        {% endif %}


        <!-- =================================================
             EMAIL FORM
        ================================================== -->

        <form
            method="POST"
            action="{{ url_for('forgot_password') }}"
        >

            <input
                type="email"
                name="email"
                placeholder="Enter your registered Gmail address"
                autocomplete="email"
                required
            >


            <button type="submit">

                📧 Send OTP to Email

            </button>

        </form>


        <!-- =================================================
             BACK TO LOGIN
        ================================================== -->

        <a
            href="{{ url_for('login') }}"
            class="back"
        >

            ← Back to Login

        </a>


    </div>


</body>

</html>
