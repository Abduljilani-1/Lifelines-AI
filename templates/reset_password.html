<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - LifeLens AI</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           OCEAN DASHBOARD BACKGROUND
        ========================================= */

        html {
            width: 100%;
            height: 100%;
        }

        body {

            width: 100%;
            min-height: 100vh;

            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            /* OCEAN COLOUR */

            background:
                linear-gradient(
                    135deg,
                    #001f3f 0%,
                    #003b5c 25%,
                    #006994 50%,
                    #008c9e 75%,
                    #004d61 100%
                ) !important;

            background-color: #006994 !important;

            background-image:
                linear-gradient(
                    135deg,
                    #001f3f 0%,
                    #003b5c 25%,
                    #006994 50%,
                    #008c9e 75%,
                    #004d61 100%
                ) !important;

            background-repeat: no-repeat !important;

            background-size: cover !important;

            background-position: center !important;

            background-attachment: fixed !important;

            overflow: hidden;
        }


        /* =========================================
           REMOVE ANY OLD BACKGROUND EFFECTS
        ========================================= */

        body::before,
        body::after {

            content: none !important;

            display: none !important;
        }


        /* =========================================
           MAIN CARD
        ========================================= */

        .container {

            width: 450px;

            max-width: 92%;

            padding: 42px 38px;

            background: #ffffff !important;

            border-radius: 25px;

            text-align: center;

            position: relative;

            z-index: 10;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.40);
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            font-size: 30px;

            font-weight: bold;

            color: #111827;

            margin-bottom: 18px;
        }


        .logo span {

            color: #008cba;
        }


        /* =========================================
           TITLE
        ========================================= */

        h2 {

            font-size: 25px;

            color: #1f2937;

            margin-bottom: 28px;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {

            background: #ffe1e1;

            color: #dc2626;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;
        }


        /* =========================================
           PASSWORD INPUT
        ========================================= */

        .password-box {

            width: 100%;

            margin-bottom: 10px;
        }


        input {

            width: 100%;

            height: 50px;

            padding: 14px;

            border: 1px solid #d1d5db;

            border-radius: 11px;

            font-size: 15px;

            color: #111827;

            background: #ffffff;

            outline: none;

            transition: 0.25s;
        }


        input:focus {

            border-color: #008cba;

            box-shadow:
                0 0 0 3px
                rgba(0, 140, 186, 0.15);
        }


        /* =========================================
           STRENGTH BAR
        ========================================= */

        .strength-container {

            width: 100%;

            height: 7px;

            margin-top: 10px;

            margin-bottom: 8px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;
        }


        .strength-bar {

            width: 0%;

            height: 100%;

            border-radius: 20px;

            transition:
                width 0.3s ease,
                background 0.3s ease;
        }


        /* =========================================
           STRENGTH TEXT
        ========================================= */

        .strength-text {

            text-align: left;

            font-size: 14px;

            font-weight: bold;

            color: #111827;

            margin-bottom: 20px;
        }


        /* =========================================
           CONFIRM PASSWORD
        ========================================= */

        .confirm-password {

            margin-bottom: 22px;
        }


        /* =========================================
           RESET BUTTON
        ========================================= */

        button {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #00b8d9,
                    #0077a3
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 7px 18px
                rgba(0, 80, 110, 0.30);
        }


        button:hover {

            transform: translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    #00d4ef,
                    #0086b5
                );
        }


        button:active {

            transform: translateY(0);
        }


        /* =========================================
           BACK TO LOGIN
        ========================================= */

        .back {

            display: inline-block;

            margin-top: 25px;

            color: #0077a3;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;
        }


        .back:hover {

            color: #004f6d;

            text-decoration: underline;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            .container {

                width: 92%;

                padding: 35px 24px;
            }

            .logo {

                font-size: 27px;
            }

            h2 {

                font-size: 23px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         RESET PASSWORD CARD
    ========================================= -->

    <div class="container">


        <div class="logo">

            🧠 LifeLens <span>AI</span>

        </div>


        <h2>

            Create New Password

        </h2>


        {% if error %}

        <div class="error">

            ⚠️ {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('reset_password') }}"
        >


            <!-- NEW PASSWORD -->

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                    oninput="checkPassword()"
                >

            </div>


            <!-- STRENGTH -->

            <div class="strength-container">

                <div
                    class="strength-bar"
                    id="strengthBar">
                </div>

            </div>


            <div
                class="strength-text"
                id="strengthText">

                Password strength: —

            </div>


            <!-- CONFIRM -->

            <div class="confirm-password">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >

            </div>


            <!-- RESET -->

            <button type="submit">

                Reset Password

            </button>


        </form>


        <a
            href="{{ url_for('login') }}"
            class="back"
        >

            ← Back to Login

        </a>


    </div>


    <!-- =========================================
         PASSWORD STRENGTH
    ========================================= -->

    <script>

        function checkPassword() {

            const password =
                document.getElementById("password").value;

            const bar =
                document.getElementById("strengthBar");

            const text =
                document.getElementById("strengthText");


            if (password.length === 0) {

                bar.style.width = "0%";

                text.innerHTML =
                    "Password strength: —";

                text.style.color =
                    "#111827";

                return;
            }


            let score = 0;


            if (password.length >= 8) {
                score++;
            }


            if (/[A-Z]/.test(password)) {
                score++;
            }


            if (/[0-9]/.test(password)) {
                score++;
            }


            if (/[^A-Za-z0-9]/.test(password)) {
                score++;
            }


            if (score <= 1) {

                bar.style.width = "25%";

                bar.style.background = "#ef4444";

                text.innerHTML =
                    "Password strength: Weak";

                text.style.color =
                    "#ef4444";
            }

            else if (score <= 3) {

                bar.style.width = "60%";

                bar.style.background = "#f59e0b";

                text.innerHTML =
                    "Password strength: Medium";

                text.style.color =
                    "#d97706";
            }

            else {

                bar.style.width = "100%";

                bar.style.background = "#22c55e";

                text.innerHTML =
                    "Password strength: Strong";

                text.style.color =
                    "#16a34a";
            }

        }

    </script>


</body>

</html>
